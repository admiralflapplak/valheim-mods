# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Flap"
name = "Fuling_Heckler"
versionNumber = "1.9.3"
description = "Comedy mod: a funny goblin (Fuling) heckles and taunts you when you die. Death counter that remembers every way you died, mocking emotes, and pranks: lurking, sneaking up, grave dancing, copying emotes, gifts. Server-shared. Harmless."
websiteUrl = "https://github.com/admiralflapplak/valheim-mods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/FulingHeckler.dll"
target = "plugins/FulingHeckler.dll"

[[build.copy]]
source = "./sounds"
target = "plugins/FulingHeckler_sounds"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "misc", "npcs", "client-side", "server-side", "deep-north-update", "ai-generated" ]
