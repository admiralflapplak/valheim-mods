# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Flap"
name = "Cogling"
versionNumber = "0.36.2"
description = "Little robot helpers (worker NPCs) that tidy your base: pick up items and auto sort them into chests, repair buildings and gear, refuel fires, keep smelters and kilns going. Each has a personality: chats, dances, naps, fishing."
websiteUrl = "https://github.com/admiralflapplak/valheim-mods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/Cogling.dll"
target = "plugins/Cogling.dll"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "npcs", "utility", "misc", "server-side", "client-side", "deep-north-update", "ai-generated" ]
