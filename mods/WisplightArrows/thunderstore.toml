# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Flap"
name = "Wisplight_Arrows"
versionNumber = "1.0.0"
description = "Mist-clearing arrows (wisp arrows, light arrows) for the Mistlands: a wisp in a glass orb parts the mist as it flies, leaves a fading wisplight where it lands, marks creatures it hits, and glows on your bow. Low damage, utility ammo, craftable."
websiteUrl = "https://github.com/admiralflapplak/valheim-mods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/WisplightArrows.dll"
target = "plugins/WisplightArrows.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "gear", "utility", "client-side", "server-side", "deep-north-update", "ai-generated" ]
